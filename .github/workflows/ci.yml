name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cotiasso
          POSTGRES_PASSWORD: cotiasso
          POSTGRES_DB: cotiasso
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cotiasso -d cotiasso"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: npm

      - name: Configuration d'environnement
        run: cp .env.example .env

      - run: npm ci

      - name: Client Prisma
        run: npm run db:generate

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

      - name: Migrations
        run: npm run db:deploy -w @cotiasso/api

      - name: Tests d'intégration
        run: npm run test:integration

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Image API
        run: docker build --target api -t cotiasso-api:ci .

      - name: Image web
        run: docker build --target web -t cotiasso-web:ci .
