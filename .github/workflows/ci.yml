name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cotiasso
          POSTGRES_PASSWORD: cotiasso
          POSTGRES_DB: cotiasso
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cotiasso -d cotiasso"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: npm

      - name: Configuration d'environnement
        run: cp .env.example .env

      - run: npm ci

      - name: Audit des dépendances npm
        run: npm audit

      - name: Client Prisma
        run: npm run db:generate

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Script de mise à jour (faux docker, ordre des étapes et arrêt avant toute modification)
        run: bash scripts/update.test.sh

      - name: Script du jeton d'installation (faux docker, jeton le plus récent seul)
        run: bash scripts/install-token.test.sh

      - name: Configuration de la copie hors site (variables OFFSITE_* traduites pour rclone, jeton OAuth intact)
        run: bash scripts/offsite-config.test.sh

      - name: Build
        run: npm run build

      - name: Migrations
        run: npm run db:deploy -w @cotiasso/api

      - name: Tests d'intégration
        run: npm run test:integration

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Variables lues par docker-compose.yml à chaque commande (démarrage, journaux, arrêt).
    env:
      POSTGRES_PASSWORD: ci-only-password
      COTIASSO_VERSION: ci
      COTIASSO_HTTP_PORT: 8088
      BACKUP_PASSPHRASE: ci-only-passphrase
      # Copie hors site vers un dossier local du conteneur : exerce rclone et l'état écrit pour l'écran d'exploitation.
      OFFSITE_TYPE: local
      OFFSITE_PATH: /offsite
    steps:
      - uses: actions/checkout@v7

      - name: Démarrage réel de la stack de production
        # Construit les trois images et démarre base, API et web : un plantage au démarrage (dépendance manquante dans
        # l'image, migration, configuration) est détecté ici, ce qu'un simple build ne montre pas.
        run: |
          # Clé générée une seule fois, mise à disposition des étapes suivantes.
          KEY="$(openssl rand -base64 32)"
          echo "MFA_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"
          export MFA_ENCRYPTION_KEY="$KEY"
          for target in api web backup; do
            docker build --target "$target" --tag "ghcr.io/valcriss/cotiasso-$target:$COTIASSO_VERSION" .
          done
          docker compose up -d --wait --wait-timeout 240

      - name: Vérification de la santé via le proxy
        run: |
          curl --fail --silent --show-error http://localhost:8088/api/health | grep '"database":"up"'
          curl --fail --silent --show-error http://localhost:8088/api/setup/status

      - name: Sauvegarde puis vérification par restauration en base temporaire
        # Sans cette étape, une sauvegarde qui ne se restaure pas ne serait jamais détectée.
        run: |
          docker compose exec -T backup /usr/local/bin/backup.sh once
          docker compose --profile tools run --rm tools verify

      - name: Copie hors site et notes de version
        run: |
          docker compose exec -T backup sh -c 'ls /offsite/cotiasso-*.tar.enc /offsite/cotiasso-*.manifest.json'
          docker compose exec -T backup cat /backups/offsite.json | tee /dev/stderr | grep '"lastError": null'
          docker compose exec -T api test -s /app/CHANGELOG.md

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêt
        if: always()
        run: docker compose down -v
