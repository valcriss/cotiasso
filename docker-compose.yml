# Environnement de développement : PostgreSQL seul. L'image de production viendra avec le lot 1.7.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cotiasso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cotiasso}
      POSTGRES_DB: ${POSTGRES_DB:-cotiasso}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
